<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能体功能配置管理 - DifyChatBackend Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .feature-card {
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            transition: all 0.3s ease;
        }
        .feature-card:hover {
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .feature-enabled {
            border-color: #28a745;
            background-color: #f8fff9;
        }
        .feature-disabled {
            border-color: #dc3545;
            background-color: #fff8f8;
        }
        .feature-toggle {
            cursor: pointer;
        }
        .agent-card {
            border: 1px solid #dee2e6;
            border-radius: 12px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .agent-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
        }
        .stats-card {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .btn-feature {
            border-radius: 20px;
            padding: 8px 20px;
            border: none;
            transition: all 0.3s ease;
        }
        .btn-feature.enabled {
            background-color: #28a745;
            color: white;
        }
        .btn-feature.disabled {
            background-color: #6c757d;
            color: white;
        }
        .feature-description {
            font-size: 0.9em;
            color: #6c757d;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-gear-fill"></i> DifyChatBackend Admin
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/admin">
                    <i class="bi bi-house"></i> 首页
                </a>
                <a class="nav-link" href="/admin/users">
                    <i class="bi bi-people"></i> 用户管理
                </a>
                <a class="nav-link active" href="/admin/agent-features">
                    <i class="bi bi-cpu"></i> 智能体功能
                </a>
                <a class="nav-link" href="/admin/logout">
                    <i class="bi bi-box-arrow-right"></i> 退出
                </a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- 页面标题和统计 -->
        <div class="row">
            <div class="col-12">
                <h2><i class="bi bi-cpu"></i> 智能体功能配置管理</h2>
                <p class="text-muted">管理各个智能体支持的功能，避免调用不支持的API</p>
            </div>
        </div>

        <!-- 统计卡片 -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="stats-card">
                    <h5><i class="bi bi-cpu"></i> 总智能体数</h5>
                    <h3 id="totalAgents">-</h3>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stats-card">
                    <h5><i class="bi bi-check-circle"></i> 已配置</h5>
                    <h3 id="configuredAgents">-</h3>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stats-card">
                    <h5><i class="bi bi-tools"></i> 功能类型</h5>
                    <h3 id="totalFeatures">-</h3>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stats-card">
                    <h5><i class="bi bi-star"></i> 最常用功能</h5>
                    <h6 id="mostUsedFeature">-</h6>
                </div>
            </div>
        </div>

        <!-- 操作按钮 -->
        <div class="row mb-3">
            <div class="col-12">
                <button class="btn btn-success" onclick="showCreateAgentModal()">
                    <i class="bi bi-plus-circle"></i> 新增智能体配置
                </button>
                <button class="btn btn-info" onclick="refreshData()">
                    <i class="bi bi-arrow-clockwise"></i> 刷新数据
                </button>
                <button class="btn btn-warning" onclick="showBulkEditModal()">
                    <i class="bi bi-gear"></i> 批量配置
                </button>
            </div>
        </div>

        <!-- 智能体列表 -->
        <div class="row">
            <div class="col-12">
                <div id="agentsList">
                    <!-- 智能体卡片将在这里动态生成 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 编辑智能体功能模态框 -->
    <div class="modal fade" id="editAgentModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="bi bi-gear"></i> 编辑智能体功能配置
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="editAgentForm">
                        <input type="hidden" id="editAgentId">
                        
                        <div class="mb-3">
                            <label for="editAgentName" class="form-label">智能体名称</label>
                            <input type="text" class="form-control" id="editAgentName" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">支持的功能</label>
                            <div id="featuresCheckboxes">
                                <!-- 功能复选框将在这里动态生成 -->
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="editAgentNotes" class="form-label">配置备注</label>
                            <textarea class="form-control" id="editAgentNotes" rows="3" placeholder="可选：添加配置说明或备注"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="saveAgentConfig()">
                        <i class="bi bi-save"></i> 保存配置
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 新增智能体模态框 -->
    <div class="modal fade" id="createAgentModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="bi bi-plus-circle"></i> 新增智能体功能配置
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="createAgentForm">
                        <div class="mb-3">
                            <label for="createAgentId" class="form-label">智能体ID</label>
                            <input type="text" class="form-control" id="createAgentId" required placeholder="如：agent_1234567890_1234">
                        </div>
                        
                        <div class="mb-3">
                            <label for="createAgentName" class="form-label">智能体名称</label>
                            <input type="text" class="form-control" id="createAgentName" required placeholder="如：财务助手">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">支持的功能</label>
                            <div id="createFeaturesCheckboxes">
                                <!-- 功能复选框将在这里动态生成 -->
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="createAgentNotes" class="form-label">配置备注</label>
                            <textarea class="form-control" id="createAgentNotes" rows="3" placeholder="可选：添加配置说明或备注"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-success" onclick="createAgentConfig()">
                        <i class="bi bi-plus-circle"></i> 创建配置
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading 提示 -->
    <div id="loadingToast" class="toast position-fixed top-0 end-0 m-3" role="alert">
        <div class="toast-body">
            <div class="d-flex align-items-center">
                <div class="spinner-border spinner-border-sm me-2" role="status"></div>
                <span>正在加载...</span>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 全局变量
        let featuresData = [];
        let agentsData = [];
        let currentEditingAgent = null;

        // 页面初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadFeatureTypes();
            loadAgentsData();
        });

        // 加载功能类型
        async function loadFeatureTypes() {
            try {
                const response = await fetch('/api/v1/feature-types', {
                    headers: {
                        'Authorization': 'Bearer ' + localStorage.getItem('access_token')
                    }
                });
                
                if (response.ok) {
                    const result = await response.json();
                    featuresData = result.data.feature_types;
                    generateFeatureCheckboxes();
                } else {
                    console.error('Failed to load feature types');
                }
            } catch (error) {
                console.error('Error loading feature types:', error);
            }
        }

        // 加载智能体数据
        async function loadAgentsData() {
            showLoading(true);
            try {
                const response = await fetch('/api/v1/agent-features', {
                    headers: {
                        'Authorization': 'Bearer ' + localStorage.getItem('access_token')
                    }
                });
                
                if (response.ok) {
                    const result = await response.json();
                    agentsData = result.data.agents;
                    updateStatistics(result.data);
                    renderAgentsList();
                } else {
                    showError('加载智能体配置失败');
                }
            } catch (error) {
                console.error('Error loading agents data:', error);
                showError('网络错误，无法加载数据');
            } finally {
                showLoading(false);
            }
        }

        // 更新统计信息
        function updateStatistics(data) {
            document.getElementById('totalAgents').textContent = data.total_count;
            document.getElementById('configuredAgents').textContent = data.total_count;
            document.getElementById('totalFeatures').textContent = featuresData.length;
            
            // 找出最常用的功能
            const stats = data.feature_statistics;
            let mostUsed = '';
            let maxCount = 0;
            for (const [feature, count] of Object.entries(stats)) {
                if (count > maxCount) {
                    maxCount = count;
                    mostUsed = feature;
                }
            }
            document.getElementById('mostUsedFeature').textContent = mostUsed || '无';
        }

        // 渲染智能体列表
        function renderAgentsList() {
            const container = document.getElementById('agentsList');
            container.innerHTML = '';

            agentsData.forEach(agent => {
                const agentCard = createAgentCard(agent);
                container.appendChild(agentCard);
            });
        }

        // 创建智能体卡片
        function createAgentCard(agent) {
            const card = document.createElement('div');
            card.className = 'agent-card';

            const enabledCount = agent.enabled_features.length;
            const totalCount = featuresData.length;
            const enabledPercentage = totalCount > 0 ? Math.round((enabledCount / totalCount) * 100) : 0;

            card.innerHTML = `
                <div class="agent-header">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <h5 class="mb-1">${agent.agent_name}</h5>
                            <p class="mb-0 opacity-75">ID: ${agent.agent_id}</p>
                        </div>
                        <div class="text-end">
                            <div class="badge bg-light text-dark fs-6">
                                ${enabledCount}/${totalCount} 功能
                            </div>
                            <div class="mt-1">
                                <small>启用率: ${enabledPercentage}%</small>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-8">
                            <h6>已启用功能</h6>
                            <div class="mb-3">
                                ${agent.enabled_features.map(feature => 
                                    `<span class="badge bg-success me-1 mb-1">${getFeatureName(feature)}</span>`
                                ).join('')}
                                ${agent.enabled_features.length === 0 ? '<span class="text-muted">无已启用功能</span>' : ''}
                            </div>
                            ${agent.notes ? `
                                <h6>配置备注</h6>
                                <p class="text-muted small">${agent.notes}</p>
                            ` : ''}
                        </div>
                        <div class="col-md-4">
                            <div class="d-grid gap-2">
                                <button class="btn btn-outline-primary btn-sm" onclick="editAgent('${agent.agent_id}')">
                                    <i class="bi bi-pencil"></i> 编辑配置
                                </button>
                                <button class="btn btn-outline-info btn-sm" onclick="testAgentFeatures('${agent.agent_id}')">
                                    <i class="bi bi-check-circle"></i> 测试功能
                                </button>
                                <button class="btn btn-outline-danger btn-sm" onclick="deleteAgent('${agent.agent_id}')">
                                    <i class="bi bi-trash"></i> 删除配置
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="row mt-3">
                        <div class="col-12">
                            <small class="text-muted">
                                最后更新: ${new Date(agent.last_updated).toLocaleString()}
                                ${agent.updated_by ? ` | 更新者: ${agent.updated_by}` : ''}
                            </small>
                        </div>
                    </div>
                </div>
            `;

            return card;
        }

        // 获取功能显示名称
        function getFeatureName(featureValue) {
            const feature = featuresData.find(f => f.value === featureValue);
            return feature ? feature.name.replace('_', ' ') : featureValue;
        }

        // 生成功能复选框
        function generateFeatureCheckboxes() {
            const editContainer = document.getElementById('featuresCheckboxes');
            const createContainer = document.getElementById('createFeaturesCheckboxes');
            
            const checkboxesHtml = featuresData.map(feature => `
                <div class="form-check mb-2">
                    <input class="form-check-input" type="checkbox" value="${feature.value}" id="feature_${feature.value}">
                    <label class="form-check-label" for="feature_${feature.value}">
                        <strong>${feature.name.replace('_', ' ')}</strong>
                        <div class="feature-description">${feature.description}</div>
                    </label>
                </div>
            `).join('');
            
            editContainer.innerHTML = checkboxesHtml;
            createContainer.innerHTML = checkboxesHtml.replace(/feature_/g, 'create_feature_');
        }

        // 编辑智能体
        function editAgent(agentId) {
            const agent = agentsData.find(a => a.agent_id === agentId);
            if (!agent) return;

            currentEditingAgent = agent;
            
            document.getElementById('editAgentId').value = agent.agent_id;
            document.getElementById('editAgentName').value = agent.agent_name;
            document.getElementById('editAgentNotes').value = agent.notes || '';

            // 设置功能复选框状态
            featuresData.forEach(feature => {
                const checkbox = document.getElementById(`feature_${feature.value}`);
                if (checkbox) {
                    checkbox.checked = agent.enabled_features.includes(feature.value);
                }
            });

            new bootstrap.Modal(document.getElementById('editAgentModal')).show();
        }

        // 保存智能体配置
        async function saveAgentConfig() {
            const agentId = document.getElementById('editAgentId').value;
            const agentName = document.getElementById('editAgentName').value;
            const notes = document.getElementById('editAgentNotes').value;
            
            const enabledFeatures = [];
            featuresData.forEach(feature => {
                const checkbox = document.getElementById(`feature_${feature.value}`);
                if (checkbox && checkbox.checked) {
                    enabledFeatures.push(feature.value);
                }
            });

            const data = {
                agent_name: agentName,
                enabled_features: enabledFeatures,
                notes: notes || null
            };

            try {
                const response = await fetch(`/api/v1/agent-features/${agentId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + localStorage.getItem('access_token')
                    },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    showSuccess('智能体配置更新成功');
                    bootstrap.Modal.getInstance(document.getElementById('editAgentModal')).hide();
                    loadAgentsData();
                } else {
                    const error = await response.json();
                    showError('更新失败: ' + error.message);
                }
            } catch (error) {
                console.error('Error saving agent config:', error);
                showError('网络错误，保存失败');
            }
        }

        // 显示创建智能体模态框
        function showCreateAgentModal() {
            document.getElementById('createAgentForm').reset();
            new bootstrap.Modal(document.getElementById('createAgentModal')).show();
        }

        // 创建智能体配置
        async function createAgentConfig() {
            const agentId = document.getElementById('createAgentId').value;
            const agentName = document.getElementById('createAgentName').value;
            const notes = document.getElementById('createAgentNotes').value;
            
            const enabledFeatures = [];
            featuresData.forEach(feature => {
                const checkbox = document.getElementById(`create_feature_${feature.value}`);
                if (checkbox && checkbox.checked) {
                    enabledFeatures.push(feature.value);
                }
            });

            const data = {
                agent_name: agentName,
                enabled_features: enabledFeatures,
                notes: notes || null
            };

            try {
                const response = await fetch(`/api/v1/agent-features/${agentId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + localStorage.getItem('access_token')
                    },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    showSuccess('智能体配置创建成功');
                    bootstrap.Modal.getInstance(document.getElementById('createAgentModal')).hide();
                    loadAgentsData();
                } else {
                    const error = await response.json();
                    showError('创建失败: ' + error.message);
                }
            } catch (error) {
                console.error('Error creating agent config:', error);
                showError('网络错误，创建失败');
            }
        }

        // 删除智能体配置
        async function deleteAgent(agentId) {
            if (!confirm('确定要删除这个智能体的功能配置吗？')) return;

            try {
                const response = await fetch(`/api/v1/agent-features/${agentId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': 'Bearer ' + localStorage.getItem('access_token')
                    }
                });

                if (response.ok) {
                    showSuccess('智能体配置删除成功');
                    loadAgentsData();
                } else {
                    const error = await response.json();
                    showError('删除失败: ' + error.message);
                }
            } catch (error) {
                console.error('Error deleting agent config:', error);
                showError('网络错误，删除失败');
            }
        }

        // 测试智能体功能
        async function testAgentFeatures(agentId) {
            try {
                const response = await fetch(`/api/v1/agent-features/${agentId}/check`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + localStorage.getItem('access_token')
                    },
                    body: JSON.stringify({})
                });

                if (response.ok) {
                    const result = await response.json();
                    const checks = result.data.feature_checks;
                    
                    let message = `功能测试结果 (${result.data.supported_count}/${result.data.total_count} 支持):\n\n`;
                    for (const [feature, supported] of Object.entries(checks)) {
                        message += `${supported ? '✅' : '❌'} ${getFeatureName(feature)}\n`;
                    }
                    
                    alert(message);
                } else {
                    const error = await response.json();
                    showError('测试失败: ' + error.message);
                }
            } catch (error) {
                console.error('Error testing agent features:', error);
                showError('网络错误，测试失败');
            }
        }

        // 刷新数据
        function refreshData() {
            loadAgentsData();
        }

        // 显示/隐藏加载状态
        function showLoading(show) {
            const toast = document.getElementById('loadingToast');
            if (show) {
                new bootstrap.Toast(toast).show();
            } else {
                bootstrap.Toast.getInstance(toast)?.hide();
            }
        }

        // 显示成功消息
        function showSuccess(message) {
            alert('✅ ' + message);
        }

        // 显示错误消息
        function showError(message) {
            alert('❌ ' + message);
        }
    </script>
</body>
</html>
