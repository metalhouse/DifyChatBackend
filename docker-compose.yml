# DifyChatBackend Docker Compose配置

version: '3.8'

services:
  # 应用服务
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=${FLASK_ENV:-development}
      - DIFY_BASE_URL=${DIFY_BASE_URL:-http://your-dify-server/v1}
      - SECRET_KEY=${SECRET_KEY:-please-change-this-secret-key}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-please-change-this-jwt-secret}
      - REDIS_ENABLED=true
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      - redis
    restart: unless-stopped

  # Redis缓存服务
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Redis管理界面 (可选)
  redis-commander:
    image: rediscommander/redis-commander:latest
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis_data:
